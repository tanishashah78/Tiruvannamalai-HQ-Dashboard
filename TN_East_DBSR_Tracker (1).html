<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TN East · DBSR Performance Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --pink:#E72388;
    --pink-dark:#B8156A;
    --pink-tint:#FDEAF4;
    --slate:#7B848E;
    --slate-dark:#4B525A;
    --ink:#1B1B22;
    --paper:#FAF8F6;
    --card:#FFFFFF;
    --line:#EAE6E2;
    --good:#1F8A5F;
    --good-tint:#E7F5EE;
    --warn:#C67A0A;
    --warn-tint:#FBF0DE;
    --bad:#C6362E;
    --bad-tint:#FBE9E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:20px;margin-bottom:22px;border-bottom:2px solid var(--ink);
    gap:16px;flex-wrap:wrap;
  }
  .brandmark{display:flex;align-items:center;gap:12px;}
  .rmark{
    width:38px;height:38px;border-radius:50%;
    background:conic-gradient(from 220deg, var(--pink), #ff7fb8, var(--pink));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:18px;flex-shrink:0;
  }
  h1{font-size:22px;margin:0;letter-spacing:-0.02em;font-weight:800;}
  .subtitle{color:var(--slate-dark);font-size:13px;margin-top:2px;}
  .territory-chip{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
    background:var(--ink);color:#fff;padding:6px 12px;border-radius:20px;font-weight:600;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;gap:4px;overflow-x:auto;margin-bottom:24px;
    border-bottom:1px solid var(--line);padding-bottom:0;
  }
  nav.tabs button{
    background:none;border:none;padding:10px 14px;font-size:13.5px;font-weight:600;
    color:var(--slate-dark);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;
    margin-bottom:-1px;font-family:inherit;
  }
  nav.tabs button.active{color:var(--pink-dark);border-bottom-color:var(--pink);}
  nav.tabs button:hover:not(.active){color:var(--ink);}

  /* ---------- Cards / layout ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;
  }
  .card h3{margin:0 0 2px;font-size:15.5px;font-weight:700;}
  .card .code{color:var(--slate);font-size:11.5px;font-family:ui-monospace,Menlo,monospace;}
  .metric-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .metric-row:first-of-type{border-top:none;margin-top:10px;}
  .metric-row .label{color:var(--slate-dark);}
  .metric-row .val{font-weight:700;font-variant-numeric:tabular-nums;}
  .pct-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .pct-good{background:var(--good-tint);color:var(--good);}
  .pct-warn{background:var(--warn-tint);color:var(--warn);}
  .pct-bad{background:var(--bad-tint);color:var(--bad);}
  .bar-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;background:var(--pink);border-radius:4px;}

  /* ---------- Upload zone ---------- */
  .upload-zone{
    border:2px dashed var(--slate);border-radius:16px;padding:26px;text-align:center;
    background:var(--card);margin-bottom:22px;cursor:pointer;transition:.15s;
  }
  .upload-zone.drag{border-color:var(--pink);background:var(--pink-tint);}
  .upload-zone strong{font-size:15px;}
  .upload-zone p{color:var(--slate-dark);font-size:13px;margin:6px 0 0;}
  input[type=file]{display:none;}

  .source-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:24px;}
  .source-card{
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);
    display:flex;flex-direction:column;gap:4px;
  }
  .source-card .name{font-weight:700;font-size:13px;}
  .source-card .status{font-size:11.5px;display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.on{background:var(--good);}
  .dot.off{background:#D9D4CE;}
  .source-card .meta{font-size:11px;color:var(--slate);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--slate);padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;}
  tr:hover td{background:#FBF9F7;}
  .tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .db-group-row td{background:var(--pink-tint);font-weight:700;color:var(--pink-dark);border-bottom:1px solid #F3C9E0;}

  .section-title{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title .hint{font-weight:500;font-size:12px;color:var(--slate);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--slate-dark);
    background:var(--card);border:1px dashed var(--line);border-radius:14px;
  }

  .mapping-toggle{
    font-size:12px;color:var(--slate-dark);cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;background:none;border:none;font-family:inherit;padding:0;margin-top:2px;
  }
  .mapping-panel{
    display:none;font-size:12.5px;color:var(--slate-dark);background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0 24px;line-height:1.6;
  }
  .mapping-panel.show{display:block;}
  .mapping-panel code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:11.5px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .kpi{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;}
  .kpi .num{font-size:24px;font-weight:800;letter-spacing:-.01em;}
  .kpi .lbl{font-size:11.5px;color:#C9C6D6;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .kpi.pink{background:var(--pink);}
</style>
</head>

const ROUTE_BY_CODE = Object.fromEntries(DBSR_ROUTES.map(r => [r.route, r]));
const KNOWN_DB_CODES = new Set(DISTRIBUTORS.map(d => d.code));


// ---------------------------------------------------------------------
// Generic helpers
// ---------------------------------------------------------------------

function normCode(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.]/g, ''));
  return Number.isFinite(n) ? Math.round(n) : String(v).trim();
}

function sheetToAOA(ws) {
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
}

// Find the row index whose cells contain ALL of `mustHave` header strings
// (case-insensitive, trimmed, substring match against stringified cell).
function findHeaderRow(aoa, mustHave, scanLimit) {
  const limit = Math.min(aoa.length, scanLimit || 25);
  for (let i = 0; i < limit; i++) {
    const row = aoa[i] || [];
    const cells = row.map(c => (c === null || c === undefined ? '' : String(c).trim().toLowerCase()));
    const ok = mustHave.every(h => cells.some(c => c === h.toLowerCase() || c.includes(h.toLowerCase())));
    if (ok) return i;
  }
  return -1;
}

function colIndex(headerRow, name, exact) {
  const target = name.toLowerCase();
  for (let i = 0; i < headerRow.length; i++) {
    const c = headerRow[i];
    if (c === null || c === undefined) continue;
    const s = String(c).trim().toLowerCase();
    if (exact ? s === target : s.includes(target)) return i;
  }
  return -1;
}

function pickSheet(wb, candidates) {
  for (const name of candidates) {
    const found = wb.SheetNames.find(n => n.toLowerCase().trim() === name.toLowerCase().trim());
    if (found) return wb.Sheets[found];
  }
  // fallback: substring match
  for (const name of candidates) {
    const found = wb.SheetNames.find(n => n.toLowerCase().includes(name.toLowerCase()));
    if (found) return wb.Sheets[found];
  }
  return null;
}

// ---------------------------------------------------------------------
// 1. Sales Flash -> SHIP metrics (per distributor)
// ---------------------------------------------------------------------
function parseSalesFlash(wb) {
  const ws = pickSheet(wb, ['DB Summary']);
  if (!ws) throw new Error('Could not find "DB Summary" sheet in Sales Flash file');
  const aoa = sheetToAOA(ws);
  const hIdx = findHeaderRow(aoa, ['Health Code', 'Distributor Name', 'Total Bud']);
  if (hIdx === -1) throw new Error('Could not locate header row in Sales Flash DB Summary');
  const header = aoa[hIdx];
  const cCode = colIndex(header, 'Health Code', true);
  const cName = colIndex(header, 'Distributor Name', true);
  // First "Total Bud" block after the identity columns is the overall RB group
  const cTotalBud = header.findIndex((h, i) => i > cName && String(h).trim().toLowerCase() === 'total bud');
  const cShip = colIndex(header.slice(cTotalBud), 'Ship', true) + cTotalBud;
  const cPickVal = colIndex(header.slice(cTotalBud), 'Pick Val', true) + cTotalBud;
  const cShipPL = colIndex(header.slice(cTotalBud), 'Ship + PL', true) + cTotalBud;
  const cAch = colIndex(header.slice(cTotalBud), 'Ach %', true) + cTotalBud;
  const cBtg = colIndex(header.slice(cTotalBud), 'BTG', true) + cTotalBud;
  const cImsDelta = colIndex(header.slice(cTotalBud), 'IMS Delta vs LD', true) + cTotalBud;
  const cPbiIms = colIndex(header.slice(cTotalBud), 'PBI IMS', true) + cTotalBud;

  const records = [];
  for (let r = hIdx + 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (!row) continue;
    const code = normCode(row[cCode]);
    if (!KNOWN_DB_CODES.has(code)) continue;
    records.push({
      dbCode: code,
      dbName: row[cName],
      totalBud: row[cTotalBud] ?? 0,
      ship: row[cShip] ?? 0,
      pickVal: row[cPickVal] ?? 0,
      shipPL: row[cShipPL] ?? 0,
      achPct: row[cAch] ?? 0,
      btg: row[cBtg] ?? 0,
      imsDelta: row[cImsDelta] ?? 0,
      pbiIms: row[cPbiIms] ?? 0,
    });
  }
  return records;
}

  const header = aoa[hIdx];
  const cDbCode = colIndex(header, 'Distributor_Code', true);
  const cDbName = colIndex(header, 'Distributor_Name', true);
  const cRetCode = colIndex(header, 'Retailer_Code', true);
  const cRetName = colIndex(header, 'Retailer_Name', true);
  const cDbsrName = colIndex(header, 'DBSR_Name', true);
  const cTsiHq = colIndex(header, 'TSI HQ', true);
  // latest-month visit/billing status columns (rightmost "Visit Status" / "Billing Status")
  let cVisitStatus = -1, cBillStatus = -1;
  for (let i = 0; i < header.length; i++) {
    const s = header[i] === null ? '' : String(header[i]).trim().toLowerCase();
    if (s.includes('visit status')) cVisitStatus = i;
    if (s.includes('billing status')) cBillStatus = i;
  }

  const records = [];
  for (let r = hIdx + 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (!row) continue;
    const code = normCode(row[cDbCode]);
    if (!KNOWN_DB_CODES.has(code)) continue;
    const dbsrName = row[cDbsrName];
    records.push({
      dbCode: code, dbName: row[cDbName],
      retailerCode: row[cRetCode], retailerName: row[cRetName],
      dbsrName,
      visitStatus: cVisitStatus >= 0 ? row[cVisitStatus] : null,
      billStatus: cBillStatus >= 0 ? row[cBillStatus] : null,
    });
  }
  return records;
}

// ---------------------------------------------------------------------
// 6. Detail Transaction Report (CSV) -> pivot Customer Code -> Net Amount,
//    joined against PROGRAM_OUTLETS by New Outlet Code
// ---------------------------------------------------------------------
function parseDetailTransactionCSV(text) {
  // header sits on the 3rd physical line ("Distributor Code,Distributor Name,...")
  const lines = text.split(/\r?\n/);
  let headerLineIdx = lines.findIndex(l => l.startsWith('Distributor Code,'));
  if (headerLineIdx === -1) headerLineIdx = 0;
  const csvBody = lines.slice(headerLineIdx).join('\n');
  const wb = XLSX.read(csvBody, { type: 'string', raw: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = sheetToAOA(ws);
  const header = aoa[0];
  const cDbCode = colIndex(header, 'Distributor Code', true);
  const cCustCode = colIndex(header, 'Customer Code', true);
  const cNetAmt = colIndex(header, 'Net Amount', true);

  const pivot = {}; // outletCode -> summed net amount
  for (let r = 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (!row || row.length < 2) continue;
    const code = normCode(row[cDbCode]);
    if (!KNOWN_DB_CODES.has(code)) continue;
    const custCode = row[cCustCode] === null || row[cCustCode] === undefined ? null : String(row[cCustCode]).trim();
    if (!custCode) continue;
    const amt = parseFloat(row[cNetAmt]) || 0;
    pivot[custCode] = (pivot[custCode] || 0) + amt;
  }

  // Join against the Program outlet master list
  return PROGRAM_OUTLETS.map(o => {
    const achievement = pivot[o.outletCode] || 0;
    const achPct = o.target ? achievement / o.target : 0;
    return { ...o, achievement, achPct, btg: (o.target || 0) - achievement };
  });
}

  const cNonGeoSales = colIndex(header, 'Non Geo Tagged Sales', false);

  const records = [];
  for (let r = hIdx + 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (!row) continue;
    const code = normCode(row[cDbCode]);
    if (!KNOWN_DB_CODES.has(code)) continue;
    const route = row[cRoute] === null || row[cRoute] === undefined ? null : String(row[cRoute]).trim();
    if (!route || !ROUTE_BY_CODE[route]) continue;
    records.push({
      dbCode: code, dbName: row[cDbName], route, routeName: row[cRouteName],
      omr: row[cOmr] ?? 0,
      geoTagAchv: cGeoTagAchv >= 0 ? row[cGeoTagAchv] ?? 0 : 0,
      hitRate: cHitRate >= 0 ? row[cHitRate] ?? 0 : 0,
      overAllEco: row[cOverAllEco] ?? 0,
      ecoGt0: cEcoGt0 >= 0 ? row[cEcoGt0] ?? 0 : 0,
      prevMonthEco: cPrevEco >= 0 ? row[cPrevEco] ?? 0 : 0,
      ecoGe800: cEcoGe800 >= 0 ? row[cEcoGe800] ?? 0 : 0,
      gapVsLmtd: row[cGapVsLmtd] ?? 0,
      grVsLmtd: row[cGrVsLmtd] ?? 0,
      ecoAchPct: cEcoAchPct >= 0 ? row[cEcoAchPct] ?? 0 : 0,
      daysEarned: cDaysEarned >= 0 ? row[cDaysEarned] ?? 0 : 0,
      gfBcPct: cGfBcPct >= 0 ? row[cGfBcPct] ?? 0 : 0,
      hhtDays: cHhtDays >= 0 ? row[cHhtDays] ?? 0 : 0,
      olVisited: cOlVisited >= 0 ? row[cOlVisited] ?? 0 : 0,
      gfVisitTotal: row[cGfVisitTotal] ?? 0,
      avgGfVisit: row[cAvgGfVisit] ?? 0,
      gfBcTotal: row[cGfBcTotal] ?? 0,
      avgGfBc: row[cAvgGfBc] ?? 0,
      cftDay: cCftDay >= 0 ? row[cCftDay] ?? 0 : 0,
      cftOrder: cCftOrder >= 0 ? row[cCftOrder] ?? 0 : 0,
      olBilled: row[cOlBilled] ?? 0,
      nonGeoSales: cNonGeoSales >= 0 ? row[cNonGeoSales] ?? 0 : 0,
    });
  }
  return records;
}

function detectFileType(fileName) {
  const n = fileName.toLowerCase();
  if (n.endsWith('.csv') || n.includes('detail transaction') || n.includes('transaction report')) return 'program';
  if (n.includes('sales flash')) return 'salesflash';
  if (n.includes('badshah')) return 'badshah';
  if (n.includes('ivy') || n.includes('assortment')) return 'ivy';
  if (n.includes('unvisited') || n.includes('unvisted')) return 'unvisited';
  if (n.includes('zone') && (n.includes('db') || n.includes('ims'))) return 'zone2';
  if (n.includes('geo')) return 'geoeco';
  return 'unknown';
}

function fmtNum(n, dp) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number(n).toLocaleString('en-IN', { maximumFractionDigits: dp ?? 2, minimumFractionDigits: 0 });
}
function fmtPct(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return (Number(n) * 100).toFixed(1) + '%';
}
function pctClass(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return 'pct-warn';
  if (n >= 0.85) return 'pct-good';
  if (n >= 0.5) return 'pct-warn';
  return 'pct-bad';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------------------------------------------------------------------
// Persistence (personal — visible only to Tanisha)
// ---------------------------------------------------------------------
async function loadStore() {
  for (const key of SOURCE_KEYS) {
    try {
      const res = await window.storage.get('source:' + key, false);
      if (res && res.value) STORE[key] = JSON.parse(res.value);
    } catch (e) { /* not found yet, fine */ }
  }
}
async function saveSource(key, payload) {
  STORE[key] = payload;
  try {
    await window.storage.set('source:' + key, JSON.stringify(payload), false);
  } catch (e) {
    console.error('storage save failed', e);
    showToast('Could not save to persistent storage — data will hold for this session only.');
  }
}

// ---------------------------------------------------------------------
// File ingestion
// ---------------------------------------------------------------------
function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsArrayBuffer(file);
  });
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsText(file);
  });
}

async function processFile(file) {
  const type = detectFileType(file.name);
  if (type === 'unknown') {
    showToast(`Couldn't tell what "${file.name}" is — rename it to include Sales Flash / Ivy / Zone 2 / Badshah / Unvisited / Detail Transaction.`);
    return;
  }
  try {
    if (type === 'program') {
      const text = await readFileAsText(file);
      const records = parseDetailTransactionCSV(text);
      await saveSource('program', { uploadedAt: Date.now(), fileName: file.name, records });
    } else {
      const buf = await readFileAsArrayBuffer(file);
      const sheetFilter = {
        salesflash: ['DB Summary'],
        ivy: ['DB', 'DBSR'],
        zone2: ['DBSR'],
        badshah: ['DBSR Wise'],
        unvisited: ["OL's Base"],
        geoeco: ['DBSR'],
      }[type];
      const wb = XLSX.read(buf, { type: 'array', sheets: sheetFilter });
      if (type === 'salesflash') {
        const records = parseSalesFlash(wb);
        await saveSource('salesflash', { uploadedAt: Date.now(), fileName: file.name, records });
      } else if (type === 'ivy') {
        const dbRecords = parseIvyDB(wb);
        const dbsrRecords = parseIvyDBSR(wb);
        await saveSource('ivy', { uploadedAt: Date.now(), fileName: file.name, dbRecords, dbsrRecords });
      } else if (type === 'zone2') {
        const records = parseZone2IMS(wb);
        await saveSource('zone2', { uploadedAt: Date.now(), fileName: file.name, records });
      } else if (type === 'badshah') {
        const records = parseBadshah(wb);
        await saveSource('badshah', { uploadedAt: Date.now(), fileName: file.name, records });
      } else if (type === 'unvisited') {
        const records = parseUnvisited(wb);
        await saveSource('unvisited', { uploadedAt: Date.now(), fileName: file.name, records });
      } else if (type === 'geoeco') {
        const records = parseGeoEco(wb);
        await saveSource('geoeco', { uploadedAt: Date.now(), fileName: file.name, records });
      }
    }
    showToast(`${SOURCE_META[type].label} updated — feeds ${SOURCE_META[type].feeds}`);
  } catch (err) {
    console.error(err);
    showToast(`Couldn't read "${file.name}": ${err.message}`);
  }
  renderAll();
}

async function handleFiles(fileList) {
  for (const file of Array.from(fileList)) {
    await processFile(file);
  }
}

    <th>Overall MTD Eco</th><th>GF Eco ≥800</th><th>GF Eco Ach %</th><th>Days Earned</th>
    <th>GF BC %</th><th>HHT Achv Days</th><th>Unique OL GF Visited</th><th>GF BC Total</th><th>OL's Billed</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- Badshah ----------
function renderBadshah(el) {
  const src = STORE.badshah;
  if (!src) return el.innerHTML = emptyState('Upload the Badshah Category Tracker to populate this tab (DBSR Wise sheet, matched on Route Code).');
  const rows = DBSR_ROUTES.map(route => {
    const r = src.records.find(x => x.route === route.route);
    const d = DB_BY_CODE[route.dbCode];
    return `<tr><td>${route.dbCode}</td><td>${d.name}</td><td>${route.route}</td><td>${route.name}</td>
      <td>${fmtNum(r?.mortein.target)}</td><td>${fmtNum(r?.mortein.ach)}</td>
      <td><span class="pct-pill ${pctClass(r?.mortein.pct)}">${r ? fmtPct(r.mortein.pct) : '—'}</span></td>
      <td>${fmtNum(r?.dkg.target)}</td><td>${fmtNum(r?.dkg.ach)}</td>
      <td><span class="pct-pill ${pctClass(r?.dkg.pct)}">${r ? fmtPct(r.dkg.pct) : '—'}</span></td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="section-title">Badshah <span class="hint">source: Badshah Category Tracker · DBSR Wise sheet · matched on Route Code</span></div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>DB Code</th><th>Distributor</th><th>Route</th><th>DBSR</th>
    <th>Mortein Target</th><th>Mortein Ach</th><th>Mortein %</th>
    <th>DKG Target</th><th>DKG Ach</th><th>DKG %</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- Program ----------
function renderProgram(el) {
  const src = STORE.program;
  if (!src) return el.innerHTML = emptyState('Upload the Detail Transaction Report CSV to populate Program (pivoted by Customer Code → Net Amount, matched to New Outlet Code).');
  const sorted = [...src.records].sort((a, b) => (b.target || 0) - (a.target || 0));
  const totalTarget = sorted.reduce((s, o) => s + (o.target || 0), 0);
  const totalAch = sorted.reduce((s, o) => s + (o.achievement || 0), 0);
  const rows = sorted.map(o => `<tr>
    <td>${o.dbName}</td><td>${o.outletCode}</td><td>${o.outletName}</td><td>${o.routeName}</td>
    <td>${fmtNum(o.target)}</td><td>${fmtNum(o.achievement)}</td>
    <td><span class="pct-pill ${pctClass(o.achPct)}">${fmtPct(o.achPct)}</span></td>
    <td>${fmtNum(o.btg)}</td>
  </tr>`).join('');
  el.innerHTML = `<div class="section-title">Program <span class="hint">source: Detail Transaction Report · pivoted on Customer Code → Net Amount</span></div>
  ${lookupHelper('map-program', `The Detail Transaction Report is pivoted by <code>Customer Code</code>, summing <code>Net Amount</code>. That total is matched to <code>New Outlet Code</code> in the Program outlet master list (seeded from her tracker's Program sheet — 54 outlets across her 5 program distributors) and written into Achievement.`)}
  <div class="kpi-row" style="margin-bottom:14px;"><div class="kpi pink"><div class="num">${fmtNum(totalAch)}</div><div class="lbl">Achievement</div></div>
  <div class="kpi"><div class="num">${totalTarget ? fmtPct(totalAch/totalTarget) : '—'}</div><div class="lbl">vs ${fmtNum(totalTarget)} Target</div></div></div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Distributor</th><th>Outlet Code</th><th>Outlet Name</th><th>DBSR</th><th>Target</th><th>Achievement</th><th>Ach %</th><th>BTG</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- Unvisited OL ----------
function renderUnvisited(el) {
  const src = STORE.unvisited;
  if (!src) return el.innerHTML = emptyState("Upload the Unvisited OL's Tracker to populate this tab (OL's Base sheet, matched on Distributor_Code).");
  const byRoute = {};
  let totalVisited = 0, totalUnvisited = 0;
  src.records.forEach(r => {
    const key = r.dbsrName || 'Unassigned';
    byRoute[key] = byRoute[key] || { dbName: r.dbName, total: 0, visited: 0, unvisited: 0, unbilled: 0 };
    byRoute[key].total++;
    const visited = r.visitStatus && String(r.visitStatus).toLowerCase() === 'visited';
    if (visited) { byRoute[key].visited++; totalVisited++; }
    else { byRoute[key].unvisited++; totalUnvisited++; }
    if (r.billStatus && String(r.billStatus).toLowerCase().includes('unbill')) byRoute[key].unbilled++;
  });
  const totalOutlets = totalVisited + totalUnvisited;
  const kpiHtml = `<div class="kpi-row" style="margin-bottom:14px;">
    <div class="kpi"><div class="num">${totalOutlets}</div><div class="lbl">Base Outlets Tracked</div></div>
    <div class="kpi pink"><div class="num">${totalVisited}</div><div class="lbl">Visit Completed</div></div>
    <div class="kpi"><div class="num">${totalUnvisited}</div><div class="lbl">Still Unvisited</div></div>
    <div class="kpi"><div class="num">${totalOutlets ? fmtPct(totalVisited/totalOutlets) : '—'}</div><div class="lbl">Visit Completion %</div></div>
  </div>`;
  const rows = Object.entries(byRoute).map(([dbsr, v]) => `<tr>
    <td>${v.dbName}</td><td>${dbsr}</td><td>${v.total}</td>
    <td>${v.visited}</td>
    <td><span class="pct-pill ${pctClass(v.total ? v.visited/v.total : 0)}">${v.total ? fmtPct(v.visited/v.total) : '—'}</span></td>
    <td>${v.unvisited}</td><td>${v.unbilled}</td>
  </tr>`).join('');
  el.innerHTML = `<div class="section-title">Unvisited OL <span class="hint">source: Unvisited OL's Tracker · OL's Base sheet · matched on Distributor_Code</span></div>
  ${lookupHelper('map-unvisited', `This is the base list of outlets that were historically hard to visit. Each row's most recent "&lt;Month&gt; Visit Status" column (found by matching whichever month-labelled visit-status column sits furthest right in the sheet) tells us if that outlet has now been visited. "Still Unbilled" checks the matching "&lt;Month&gt; GF Billing Status" column.`)}
  ${kpiHtml}
  <div class="tbl-wrap"><table><thead><tr><th>Distributor</th><th>DBSR</th><th>Base Outlets</th><th>Visit Completed</th><th>Visit %</th><th>Still Unvisited</th><th>Still Unbilled</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
function renderAll() {
  renderSourceList();
  renderTabs();
  renderContent();
}

function wireUpload() {
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', e => { handleFiles(e.target.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}

(async function init() {
  await loadStore();
  wireUpload();
  renderAll();
})();

</script>
</body>
